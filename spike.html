<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tethered — mapgen spike (throwaway)</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0e14; color: #cfd2e0; font: 13px/1.5 monospace; }
    canvas { display: block; }
    #hud { position: fixed; top: 8px; left: 10px; white-space: pre; pointer-events: none; text-shadow: 0 1px 2px #000; }
  </style>
</head>
<body>
  <!-- M0 spike: static mapgen harness. THROWAWAY — only src/mapgen.js is real.
       Keys: R = regenerate (new seed) · 1-9/0 = depth (0 = 10) · C = clearance
       heatmap · P = pegs · S = same-seed regen · edge-roughness knobs below
       regenerate the SAME seed so changes compare apples-to-apples. -->
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <script src="src/tuning.js"></script>
  <script src="src/mapgen.js"></script>
  <script>
    (function (S) {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const hud = document.getElementById('hud');
      let depth = 1;
      let seed = null; // null = roll a fresh one
      let map = null;
      let showClearance = false;
      let showPegs = true;

      // Edge-roughness knobs, live-tweakable: [decreaseKey, increaseKey].
      // Mutates TUNING directly — mapgen reads it fresh every generate.
      const KNOBS = [
        { key: 'CA_NOISE_FLOOR_P', label: 'noiseFloorP', dec: 'KeyQ', inc: 'KeyW', step: 0.05, min: 0, max: 0.9, fmt: (v) => v.toFixed(2) },
        { key: 'CA_NOISE_WALL_P', label: 'noiseWallP', dec: 'KeyA', inc: 'KeyS', step: 0.05, min: 0, max: 0.9, fmt: (v) => v.toFixed(2) },
        { key: 'CA_NOISE_DEPTH', label: 'noiseDepth', dec: 'KeyZ', inc: 'KeyX', step: 1, min: 1, max: 4, fmt: (v) => String(v) },
        { key: 'CA_EDGE_ITERS', label: 'caSmooth', dec: 'KeyE', inc: 'KeyD', step: 1, min: 0, max: 6, fmt: (v) => String(v) },
        { key: 'CA_POST_NOISE_P', label: 'postNoiseP', dec: 'KeyT', inc: 'KeyG', step: 0.03, min: 0, max: 0.6, fmt: (v) => v.toFixed(2) },
        { key: 'WALL_SMOOTH_ITERS', label: 'chaikin', dec: 'KeyB', inc: 'KeyN', step: 1, min: 0, max: 5, fmt: (v) => String(v) },
        { key: 'WALL_SIMPLIFY_PX', label: 'simplifyPx', dec: 'KeyJ', inc: 'KeyK', step: 0.5, min: 0, max: 8, fmt: (v) => v.toFixed(1) },
      ];
      const DEFAULTS = Object.fromEntries(KNOBS.map((k) => [k.key, S.TUNING[k.key]]));

      function regen(reuseSeed) {
        map = S.generateMap(depth, reuseSeed ? map && map.seed : seed);
        draw();
      }

      function draw() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const T = S.TUNING;
        const scale = Math.min(canvas.width / map.w, canvas.height / map.h) * 0.97;
        const ox = (canvas.width - map.w * scale) / 2;
        const oy = (canvas.height - map.h * scale) / 2;
        const ts = T.TILE_SIZE * scale;

        ctx.fillStyle = '#0d0e14';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Clearance heatmap still draws per-tile; otherwise the smooth wall
        // loops are the truth — fill the world wall-dark, punch the floor
        // out with an even-odd fill of every loop, and stroke the edges.
        if (showClearance) {
          for (let ty = 0; ty < map.th; ty++) {
            for (let tx = 0; tx < map.tw; tx++) {
              if (map.tiles[ty * map.tw + tx] === 1) continue;
              const c = Math.min(map.clearance[ty * map.tw + tx], 20) / 20;
              ctx.fillStyle = `rgb(${30 + c * 50}, ${50 + c * 150}, ${70 + c * 100})`;
              ctx.fillRect(ox + tx * ts, oy + ty * ts, ts + 0.5, ts + 0.5);
            }
          }
        } else {
          ctx.save();
          ctx.translate(ox, oy);
          ctx.scale(scale, scale);
          ctx.fillStyle = '#1c1f2a';
          ctx.fillRect(0, 0, map.w, map.h);
          ctx.beginPath();
          for (const loop of map.wallLoops) {
            const p = loop.pts;
            ctx.moveTo(p[0][0], p[0][1]);
            for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
            ctx.closePath();
          }
          ctx.fillStyle = '#2a2d3d';
          ctx.fill('evenodd');
          ctx.strokeStyle = '#3a3f52';
          ctx.lineWidth = 2 / scale;
          ctx.lineJoin = 'round';
          ctx.stroke();
          ctx.restore();
        }

        // Chamber stamps (outlines) — sanity-check placement and footprint.
        ctx.strokeStyle = 'rgba(120, 140, 255, 0.35)';
        ctx.lineWidth = 1;
        for (const c of map.chambers) {
          ctx.beginPath();
          ctx.arc(ox + c.cx * ts, oy + c.cy * ts, c.r * ts, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Pegs: every wrappable convex wall corner.
        if (showPegs) {
          ctx.fillStyle = 'rgba(255, 170, 60, 0.9)';
          for (const p of map.pegs) {
            ctx.beginPath();
            ctx.arc(ox + p.x * scale, oy + p.y * scale, Math.max(1.5, p.r * scale), 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Spawn (green) and exit (red).
        const mark = (pt, color) => {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(ox + pt.x * scale, oy + pt.y * scale, 7, 0, Math.PI * 2);
          ctx.fill();
        };
        mark(map.spawn, '#5dffa0');
        mark(map.exit, '#ff5d6e');

        const st = map.stats;
        const knobLine = KNOBS.map((k) => {
          const v = S.TUNING[k.key];
          const dirty = v !== DEFAULTS[k.key] ? '*' : '';
          return `${k.label}${dirty} ${k.fmt(v)} [${k.dec.slice(3).toLowerCase()}/${k.inc.slice(3).toLowerCase()}]`;
        }).join('   ');
        hud.textContent =
          `depth ${depth}  seed ${map.seed}  ${map.tw}x${map.th} tiles (${map.w}x${map.h}px)\n` +
          `gen ${st.genMs.toFixed(1)}ms (${st.attempts} attempt${st.attempts > 1 ? 's' : ''})  ` +
          `floor ${(st.floorFraction * 100).toFixed(1)}%  corridor ${(st.corridorFrac * 100).toFixed(1)}%  chambers ${st.chambersPlaced}/${st.chamberTarget}  ` +
          `loops ${st.contourLoops}  segs ${st.segCount}  pegs ${st.pegCount}\n` +
          `spawn->exit ${Math.round(st.spawnExitPathPx)}px (need ${Math.round(st.gateNeedPx)}) ` +
          `gate ${st.gatePass ? 'PASS' : 'FAIL'}\n` +
          `[R] reseed  [S] same seed  [1-9, 0] depth  [C] clearance ${showClearance ? 'on' : 'off'}  [P] pegs ${showPegs ? 'on' : 'off'}  [V] reset knobs\n` +
          `edges:  ${knobLine}`;
      }

      window.addEventListener('keydown', (e) => {
        for (const k of KNOBS) {
          if (e.code === k.dec || e.code === k.inc) {
            const dir = e.code === k.inc ? 1 : -1;
            const v = S.TUNING[k.key] + dir * k.step;
            S.TUNING[k.key] = Math.round(Math.min(k.max, Math.max(k.min, v)) * 100) / 100;
            regen(true); // same seed: isolate the knob's effect
            return;
          }
        }
        if (e.code === 'KeyR') { seed = null; regen(false); }
        else if (e.code === 'KeyS') regen(true);
        else if (e.code === 'KeyC') { showClearance = !showClearance; draw(); }
        else if (e.code === 'KeyP') { showPegs = !showPegs; draw(); }
        else if (e.code === 'KeyV') {
          for (const k of KNOBS) S.TUNING[k.key] = DEFAULTS[k.key];
          regen(true);
        }
        else if (/^Digit\d$/.test(e.code)) {
          depth = e.code === 'Digit0' ? 10 : Number(e.code.slice(5));
          regen(false);
        }
      });
      window.addEventListener('resize', () => map && draw());

      regen(false);
    })(Tethered);
  </script>
</body>
</html>
